[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-docs-chain-agent"
version = "0.1.0"
description = "Pharos Doc-Chain Action Agent combining official Developer Docs MCP and hosted Chain MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "JimmyOgb"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
pharos-docs-chain-agent = "pharos_docs_chain_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
